name: Docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.api-server"
      - "rslib/**"
      - "python/rwkv/**"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - "proto/**"
      - "ftl/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: anki-api-server-image
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 #v4

      # Export only reusable dependencies. Application source changes otherwise
      # upload a large target directory that the next source change invalidates.
      - name: Cache API dependencies
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api-server
          target: deps
          cache-from: type=gha,scope=anki-api-deps
          cache-to: type=gha,mode=max,scope=anki-api-deps
          secret-envs: |
            actions_results_url=ACTIONS_RESULTS_URL
            actions_runtime_token=ACTIONS_RUNTIME_TOKEN

      - name: Cache CPU inference runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api-server
          target: runtime
          cache-from: type=gha,scope=anki-api-runtime
          cache-to: type=gha,mode=min,scope=anki-api-runtime

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api-server
          push: false
          load: true
          cache-from: |
            type=gha,scope=anki-api-deps
            type=gha,scope=anki-api-runtime
          secret-envs: |
            actions_results_url=ACTIONS_RESULTS_URL
            actions_runtime_token=ACTIONS_RUNTIME_TOKEN
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:main

      - name: Smoke test runtime before publishing
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cleanup() {
            docker logs anki-api-smoke || true
            docker rm --force anki-api-smoke || true
          }
          trap cleanup EXIT
          docker run --detach --name anki-api-smoke \
            --publish 127.0.0.1:18765:8765 \
            --env ANKI_API_COLLECTION_PATH=/tmp/smoke.anki2 \
            "$IMAGE:sha-$REVISION"
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/health > "$RUNNER_TEMP/anki-health.json"; then
              python3 -c 'import json,sys; health=json.load(open(sys.argv[1])); assert health["status"] == "ok" and health["collection_open"] is True, health' "$RUNNER_TEMP/anki-health.json"
              healthy=true
              break
            fi
            sleep 1
          done
          test "$healthy" = true
          # An empty, temporary collection exercises model loading and the
          # embedded worker without syncing or changing scheduling.
          docker exec anki-api-smoke /opt/rwkv/bin/python /opt/rwkv/job.py \
            --no-sync --wait-timeout 120

      - name: Publish verified main image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:main"
